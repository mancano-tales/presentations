project:
  type: website
  render:
    - index.qmd
    - talks/**/index.qmd

website:
  title: "Apresentações — Tales Mançano"
  navbar:
    left:
      - href: index.qmd
        text: Todas as apresentações
    right:
      - icon: house
        href: https://mancano-tales.github.io/

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  revealjs:
    theme: simple
    slide-number: true
